name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — tests and style
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, gd, intl, mbstring, pcntl, pdo_sqlite, sqlite3, zip
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        working-directory: apps/api
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        working-directory: apps/api
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Check formatting
        working-directory: apps/api
        run: vendor/bin/pint --test

      - name: Run Pest suite
        working-directory: apps/api
        run: php artisan test --compact

      - name: Audit PHP dependencies
        working-directory: apps/api
        run: composer audit --locked

  frontend:
    name: Website and Studio — typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm lint

      - name: Build website
        run: pnpm --filter @meridian/website build

      - name: Build Studio
        run: pnpm --filter @meridian/studio build

  e2e:
    name: End-to-end, accessibility, and performance
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [api]

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, gd, intl, mbstring, pcntl, pdo_sqlite, sqlite3, zip
          coverage: none

      - name: Install Composer dependencies
        working-directory: apps/api
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare database
        working-directory: apps/api
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate:fresh --seed --force
          php artisan storage:link

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser dependencies
        working-directory: apps/e2e
        run: npx playwright install-deps chrome

      - name: Start API
        working-directory: apps/api
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid

      - name: Start website and Studio
        run: |
          pnpm --filter @meridian/website dev > /tmp/website.log 2>&1 &
          echo $! > /tmp/website.pid
          pnpm --filter @meridian/studio dev > /tmp/studio.log 2>&1 &
          echo $! > /tmp/studio.pid

      - name: Wait for services
        run: |
          for url in \
            http://127.0.0.1:8000/api/v1/health \
            http://localhost:3002/en \
            http://localhost:3003/login; do
            for attempt in $(seq 1 90); do
              if curl -fsS "$url" > /dev/null; then
                echo "ready: $url"
                break
              fi
              if [ "$attempt" -eq 90 ]; then
                echo "timed out waiting for $url"
                exit 1
              fi
              sleep 2
            done
          done

      - name: Run Playwright suite (journeys, axe, performance budget)
        working-directory: apps/e2e
        run: pnpm test
        env:
          E2E_BASE_URL: http://localhost:3002
          E2E_API_URL: http://localhost:8000
          E2E_STUDIO_URL: http://localhost:3003

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 7

      - name: Show server logs
        if: failure()
        run: |
          echo "=== API ==="; tail -n 100 /tmp/api.log || true
          echo "=== Website ==="; tail -n 100 /tmp/website.log || true
          echo "=== Studio ==="; tail -n 100 /tmp/studio.log || true
