# Static portfolio demo: no API, database, or server functions required.
# The full-stack deployment path is documented in docs/DEPLOYMENT.md.
[build]
  command = "cd ../.. && pnpm install --frozen-lockfile && pnpm --filter @meridian/website generate"
  publish = ".output/public"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10.34.9"
  NUXT_PUBLIC_DEMO_STATIC = "true"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
