    delete:
      tags: [Forms and leads]
      summary: Delete a lead
      responses:
        '200': { description: Lead deleted }

  /admin/leads/{lead}/activities:
    post:
      tags: [Forms and leads]
      summary: Add a note or follow-up activity
      parameters:
        - name: lead
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, note]
              properties:
                type: { type: string, examples: [note, call, email] }
                note: { type: string }
      responses:
        '201': { description: Activity added }

  /admin/seo/health:
    get:
      tags: [SEO]
      summary: SEO health score and issue counts
      responses:
        '200': { description: SEO health payload }

  /admin/seo/audit:
    post:
      tags: [SEO]
      summary: Run the deterministic SEO audit
      responses:
        '200': { description: Audit completed }

  /admin/seo/issues:
    get:
      tags: [SEO]
      summary: List SEO issues
      responses:
        '200': { description: Issue collection }

  /admin/redirects:
    get:
      tags: [SEO]
      summary: List redirects
      responses:
        '200': { description: Redirect collection }
    post:
      tags: [SEO]
      summary: Create a redirect
      responses:
        '201': { description: Redirect created }

  /admin/users:
    get:
      tags: [Access]
      summary: List users with site roles
      responses:
        '200': { description: User collection }

  /admin/roles:
    get:
      tags: [Access]
      summary: List roles and permissions
      responses:
        '200': { description: Role collection }

  /admin/audit-logs:
    get:
      tags: [Access]
      summary: Read the audit trail
      responses:
        '200': { description: Audit entries }

  /admin/settings:
    get:
      tags: [Settings]
      summary: Current site settings and integration states
      responses:
        '200': { description: Settings payload }
    patch:
      tags: [Settings]
      summary: Update site settings
      responses:
        '200': { description: Settings updated }

  /admin/integrations/{provider}:
    put:
      tags: [Settings]
      summary: Configure an integration
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [google_search_console, google_analytics_4, google_tag_manager] }
      responses:
        '200': { description: Integration saved }
        '422': { description: Credentials rejected or unverifiable }

  /admin/workflows:
    get:
      tags: [Workflow]
      summary: List workflow definitions
      responses:
        '200': { description: Workflow definitions }

components:
  securitySchemes:
    sanctumCookie:
      type: apiKey
      in: cookie
      name: laravel_session
      description: |
        Sanctum SPA session cookie. Obtain it through `GET /sanctum/csrf-cookie`
        followed by `POST /auth/login`, then send `X-XSRF-TOKEN` on writes.

  parameters:
    SiteHeader:
      name: X-Site
      in: header
      required: true
      description: Site slug, for example `meridian`.
      schema: { type: string, default: meridian }
    LocaleHeader:
      name: X-Locale
      in: header
      required: false
      description: Content locale. Defaults to the site default (Thai).
      schema: { type: string, enum: [th, en, zh-CN] }
    PageId:
      name: page
      in: path
      required: true
      schema: { type: integer }

  responses:
    Unauthenticated:
      description: No active session
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: The user lacks the required site-scoped permission
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found for this site
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      properties:
        message: { type: string }
        code: { type: string }
    ValidationError:
      type: object
      properties:
        message: { type: string, example: The submitted data is invalid. }
        code: { type: string, example: validation_error }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

    Locale:
      type: object
      properties:
        code: { type: string }
        route: { type: string }
        label: { type: string }
        short: { type: string }
        html: { type: string }
        is_default: { type: boolean }

    Site:
      type: object
      properties:
        name: { type: string }
        legal_name: { type: string }
        slug: { type: string }
        default_locale: { type: string }
        brand: { type: object, additionalProperties: true }
        theme: { type: object, additionalProperties: true }
        demo_mode: { type: boolean }

    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        job_title: { type: string, nullable: true }
        locale: { type: string, nullable: true }
        initials: { type: string }
        is_super_admin: { type: boolean }
        roles:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              slug: { type: string }
              level: { type: integer }
              site_id: { type: integer, nullable: true }
        permissions:
          type: array
          items: { type: string }
        sites:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              slug: { type: string }
              domain: { type: string, nullable: true }
              default_locale: { type: string }
              enabled_locales:
                type: array
                items: { type: string }
        current_site_id: { type: integer, nullable: true }
        notifications_unread: { type: integer }

    Seo:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        canonical: { type: string, format: uri }
        focus_keyword: { type: string, nullable: true }
        robots: { type: string, example: index,follow }
        schema_type: { type: string, example: WebPage }
        og:
          type: object
          properties:
            title: { type: string }
            description: { type: string }
            image: { type: string, format: uri, nullable: true }
            type: { type: string }
        schema:
          type: array
          items: { type: object, additionalProperties: true }

    SeoInput:
      type: object
      properties:
        title: { type: string, maxLength: 255 }
        description: { type: string, maxLength: 500 }
        canonical: { type: string, format: uri, nullable: true }
        focus_keyword: { type: string, nullable: true }
        og_title: { type: string, nullable: true }
        og_description: { type: string, nullable: true }
        og_image_id: { type: integer, nullable: true }
        robots: { type: string, example: index,follow }
        schema_type: { type: string, example: WebPage }

    BlockInput:
      type: object
      required: [type]
      properties:
        block_uid: { type: string, nullable: true }
        type: { type: string, description: One of the server-side block registry keys. }
        props:
          type: object
          additionalProperties: true
        is_visible_desktop: { type: boolean, default: true }
        is_visible_tablet: { type: boolean, default: true }
        is_visible_mobile: { type: boolean, default: true }
        responsive:
          type: object
          nullable: true
          properties:
            desktop: { type: boolean }
            tablet: { type: boolean }
            mobile: { type: boolean }
            overrides: { type: object, additionalProperties: true }

    Block:
      allOf:
        - $ref: '#/components/schemas/BlockInput'
        - type: object
          properties:
            uid: { type: string }
            resolved: { type: object, additionalProperties: true, nullable: true }

    Alternate:
      type: object
      properties:
        locale: { type: string }
        hreflang: { type: string }
        url: { type: string, format: uri }

    Breadcrumb:
      type: object
      properties:
        label: { type: string }
        url: { type: string, format: uri }

    PageSummary:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        slug: { type: string }
        status:
          type: string
          enum: [draft, in_review, changes_requested, approved, scheduled, published, archived]
        is_home: { type: boolean }
        author: { type: string, nullable: true }
        updated_at: { type: string, format: date-time }
        published_at: { type: string, format: date-time, nullable: true }
        scheduled_at: { type: string, format: date-time, nullable: true }
        lock_version: { type: integer }
        locales:
          type: array
          items: { type: object }
        missing_locales:
          type: array
          items: { type: string }

    PageCapabilities:
      type: object
      properties:
        edit: { type: boolean }
        publish: { type: boolean }
        approve: { type: boolean }

    PageDetail:
      allOf:
        - $ref: '#/components/schemas/PageSummary'
        - type: object
          properties:
            excerpt: { type: string, nullable: true }
            template: { type: string }
            parent_id: { type: integer, nullable: true }
            blocks:
              type: array
              items: { $ref: '#/components/schemas/Block' }
            seo: { $ref: '#/components/schemas/Seo' }
            revisions: { type: array, items: { type: object } }
            workflow: { type: object, nullable: true }
            capabilities: { $ref: '#/components/schemas/PageCapabilities' }

    PagePayload:
      type: object
      properties:
        type: { type: string, example: page }
        id: { type: integer }
        template: { type: string }
        status: { type: string }
        is_home: { type: boolean }
        locale: { type: string }
        content_locale: { type: string }
        is_fallback: { type: boolean }
        title: { type: string }
        slug: { type: string }
        excerpt: { type: string, nullable: true }
        url: { type: string }
        published_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
        featured_image: { $ref: '#/components/schemas/MediaAsset', nullable: true }
        blocks:
          type: array
          items: { $ref: '#/components/schemas/Block' }
        seo: { $ref: '#/components/schemas/Seo' }
        breadcrumbs:
          type: array
          items: { $ref: '#/components/schemas/Breadcrumb' }
        alternates:
          type: array
          items: { $ref: '#/components/schemas/Alternate' }
        preview: { type: boolean }

    MediaAsset:
      type: object
      properties:
        id: { type: integer }
        url: { type: string, format: uri }
        alt:
          type: object
          additionalProperties: { type: string }
        caption:
          type: object
          additionalProperties: { type: string }
        credit: { type: string, nullable: true }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        focal_x: { type: number, minimum: 0, maximum: 1 }
        focal_y: { type: number, minimum: 0, maximum: 1 }
        variants:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              url: { type: string, format: uri }
              width: { type: integer, nullable: true }
              height: { type: integer, nullable: true }

    CollectionCard:
      type: object
      properties:
        slug: { type: string }
        title: { type: string }
        excerpt: { type: string, nullable: true }
        url: { type: string }
        image: { $ref: '#/components/schemas/MediaAsset', nullable: true }

    SearchGroup:
      type: object
      properties:
        type: { type: string }
        label: { type: string }
        items:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              excerpt: { type: string, nullable: true }
              url: { type: string }
              type: { type: string }

    Lead:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }
        company: { type: string, nullable: true }
        message: { type: string, nullable: true }
        source: { type: string }
        status: { type: string }
        priority: { type: string, enum: [low, normal, high, urgent] }
        owner:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            name: { type: string }
        last_activity_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    Pagination:
      type: object
      properties:
        current_page: { type: integer }
        last_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
