openapi: 3.1.0
info:
  title: Meridian Platform API
  version: 1.0.0
  description: |
    Versioned REST API for the Meridian public website, MERIDIAN STUDIO CMS, and
    the shared publishing pipeline. All responses are JSON unless noted.

    Authentication uses Laravel Sanctum SPA cookies. The Studio must first call
    `GET /sanctum/csrf-cookie` (outside this versioned prefix), then send the
    `X-XSRF-TOKEN` header on writes. Public content endpoints are stateless and
    require the `X-Site` header (site slug) plus an optional `X-Locale` header.

    Demo content, figures, and outcomes are illustrative.
  contact:
    name: Meridian Platform Team
    email: platform@meridian.example
  license:
    name: Proprietary demonstration project
servers:
  - url: http://localhost:8000/api/v1
    description: Local development
  - url: https://api.meridian.example/api/v1
    description: Illustrative production host

tags:
  - name: Auth
  - name: Public
  - name: Pages
  - name: Workflow
  - name: Media
  - name: Content
  - name: Forms and leads
  - name: SEO
  - name: Access
  - name: Settings

security:
  - sanctumCookie: []

paths:
  /health:
    get:
      tags: [Public]
      summary: Liveness and database check
      security: []
      responses:
        '200':
          description: Service and database are healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok, degraded] }
                  database: { type: string, enum: [ok, unavailable] }
                  version: { type: string }
                  time: { type: string, format: date-time }
        '503':
          description: Database unavailable

  /auth/login:
    post:
      tags: [Auth]
      summary: Start a Sanctum SPA session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                remember: { type: boolean, default: false }
      responses:
        '200':
          description: Authenticated user and effective permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/logout:
    post:
      tags: [Auth]
      summary: End the session
      responses:
        '200':
          description: Signed out
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /auth/me:
    get:
      tags: [Auth]
      summary: Current user, sites, roles, and permissions
      parameters:
        - $ref: '#/components/parameters/SiteHeader'
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /public/bootstrap:
    get:
      tags: [Public]
      summary: Site identity, enabled locales, navigation, public settings
      parameters:
        - $ref: '#/components/parameters/SiteHeader'
        - $ref: '#/components/parameters/LocaleHeader'
      responses:
        '200':
          description: Bootstrap payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      site: { $ref: '#/components/schemas/Site' }
                      locales:
                        type: array
                        items: { $ref: '#/components/schemas/Locale' }
                      current_locale: { type: string }
                      navigation: { type: object, additionalProperties: true }
                      settings: { type: object, additionalProperties: true }
                      organization: { type: object, additionalProperties: true }
        '404':
          $ref: '#/components/responses/NotFound'

  /public/home:
    get:
      tags: [Public]
      summary: Published homepage for a locale
      parameters:
        - $ref: '#/components/parameters/SiteHeader'
        - $ref: '#/components/parameters/LocaleHeader'
      responses:
        '200':
          description: Homepage payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PagePayload' }
        '404':
          $ref: '#/components/responses/NotFound'

  /public/pages/{slug}:
    get:
      tags: [Public]
      summary: Published page by localized slug
      parameters:
        - $ref: '#/components/parameters/SiteHeader'
        - $ref: '#/components/parameters/LocaleHeader'
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Page payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PagePayload' }
        '404':
          $ref: '#/components/responses/NotFound'

  /public/preview/{token}:
    get:
      tags: [Public]
      summary: Render a preview token issued by the CMS
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Preview payload
        '404':
          description: Invalid or expired preview token

  /public/solutions:
    get:
      tags: [Public]
      summary: Published solutions
      parameters:
        - $ref: '#/components/parameters/SiteHeader'
        - $ref: '#/components/parameters/LocaleHeader'
      responses:
        '200':
          description: Solution collection
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CollectionCard' }

  /public/solutions/{slug}:
    get:
      tags: [Public]
      summary: Published solution detail
      parameters:
        - $ref: '#/components/parameters/SiteHeader'
        - $ref: '#/components/parameters/LocaleHeader'
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Solution detail }
        '404': { $ref: '#/components/responses/NotFound' }

  /public/industries:
    get:
      tags: [Public]
      summary: Published industries
      parameters:
        - $ref: '#/components/parameters/SiteHeader'
        - $ref: '#/components/parameters/LocaleHeader'
      responses:
        '200': { description: Industry collection }

  /public/industries/{slug}:
    get:
      tags: [Public]
      summary: Published industry detail
      parameters:
        - $ref: '#/components/parameters/SiteHeader'
        - $ref: '#/components/parameters/LocaleHeader'
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Industry detail }
        '404': { $ref: '#/components/responses/NotFound' }

  /public/case-studies:
    get:
      tags: [Public]
      summary: Published case studies
      parameters:
        - $ref: '#/components/parameters/SiteHeader'
        - $ref: '#/components/parameters/LocaleHeader'
        - name: industry
          in: query
          schema: { type: string }
        - name: solution
          in: query
          schema: { type: string }
      responses:
        '200': { description: Case study collection }

  /public/case-studies/{slug}:
    get:
      tags: [Public]
      summary: Published case study detail
      parameters:
        - $ref: '#/components/parameters/SiteHeader'
        - $ref: '#/components/parameters/LocaleHeader'
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Case study detail }
        '404': { $ref: '#/components/responses/NotFound' }

  /public/articles:
    get:
      tags: [Public]
      summary: Published insights and news
      parameters:
        - $ref: '#/components/parameters/SiteHeader'
        - $ref: '#/components/parameters/LocaleHeader'
        - name: type
          in: query
          schema: { type: string, enum: [insight, news] }
        - name: category
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        '200': { description: Article collection }

  /public/articles/{slug}:
    get:
      tags: [Public]
      summary: Published article detail
      parameters:
        - $ref: '#/components/parameters/SiteHeader'
        - $ref: '#/components/parameters/LocaleHeader'
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Article detail }
        '404': { $ref: '#/components/responses/NotFound' }

  /public/careers:
    get:
      tags: [Public]
      summary: Open roles
      parameters:
        - $ref: '#/components/parameters/SiteHeader'
        - $ref: '#/components/parameters/LocaleHeader'
      responses:
        '200': { description: Job collection }

  /public/careers/{slug}:
    get:
      tags: [Public]
      summary: Job detail
      parameters:
        - $ref: '#/components/parameters/SiteHeader'
        - $ref: '#/components/parameters/LocaleHeader'
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Job detail }
        '404': { $ref: '#/components/responses/NotFound' }

  /public/documents:
    get:
      tags: [Public]
      summary: Public documents and reports
      parameters:
        - $ref: '#/components/parameters/SiteHeader'
      responses:
        '200': { description: Document collection }

  /public/team:
    get:
      tags: [Public]
      summary: Published leadership profiles
      parameters:
        - $ref: '#/components/parameters/SiteHeader'
      responses:
        '200': { description: Team collection }

  /public/search:
    get:
      tags: [Public]
      summary: Grouped search across pages and editorial content
      parameters:
        - $ref: '#/components/parameters/SiteHeader'
        - $ref: '#/components/parameters/LocaleHeader'
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 8 }
      responses:
        '200':
          description: Search results grouped by content type
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      engine: { type: string, enum: [meilisearch, database] }
                      groups:
                        type: array
                        items: { $ref: '#/components/schemas/SearchGroup' }
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /public/search/suggestions:
    get:
      tags: [Public]
      summary: Lightweight typeahead suggestions
      parameters:
        - $ref: '#/components/parameters/SiteHeader'
        - $ref: '#/components/parameters/LocaleHeader'
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2 }
      responses:
        '200': { description: Suggestion list }

  /public/sitemap:
    get:
      tags: [Public]
      summary: Localized sitemap entries
      parameters:
        - $ref: '#/components/parameters/SiteHeader'
        - name: locale
          in: query
          schema: { type: string, enum: [th, en, zh-CN] }
      responses:
        '200':
          description: Sitemap entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      urls:
                        type: array
                        items:
                          type: object
                          properties:
                            loc: { type: string, format: uri }
                            lastmod: { type: string, format: date-time, nullable: true }
                            changefreq: { type: string }
                            priority: { type: string }

  /public/sitemap-index:
    get:
      tags: [Public]
      summary: Per-locale sitemap index
      parameters:
        - $ref: '#/components/parameters/SiteHeader'
      responses:
        '200': { description: Sitemap index entries }

  /public/forms/{key}/submissions:
    post:
      tags: [Public]
      summary: Submit a public form
      security: []
      parameters:
        - $ref: '#/components/parameters/SiteHeader'
        - $ref: '#/components/parameters/LocaleHeader'
        - name: key
          in: path
          required: true
          schema: { type: string, examples: [contact, partnership, general] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Field names come from the form schema returned by /public/contact.
              additionalProperties: true
              properties:
                consent: { type: boolean }
                website: { type: string, description: Honeypot; must stay empty. }
                elapsed_ms: { type: integer, minimum: 0 }
                page: { type: string }
      responses:
        '201':
          description: Submission accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  reference: { type: string, example: MRD-000123 }
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /public/jobs/{slug}/applications:
    post:
      tags: [Public]
      summary: Apply for a role
      security: []
      parameters:
        - $ref: '#/components/parameters/SiteHeader'
        - name: slug
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, email, consent]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                message: { type: string }
                consent: { type: boolean }
                cv:
                  type: string
                  format: binary
      responses:
        '201': { description: Application accepted }
        '422': { $ref: '#/components/responses/ValidationError' }

  /public/analytics/events:
    post:
      tags: [Public]
      summary: Record a first-party analytics event
      security: []
      parameters:
        - $ref: '#/components/parameters/SiteHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, examples: [page_view, cta_click, search] }
                path: { type: string }
                locale: { type: string }
                referrer: { type: string }
                meta: { type: object, additionalProperties: true }
      responses:
        '202': { description: Event accepted }

  /admin/dashboard:
    get:
      tags: [Pages]
      summary: CMS dashboard metrics
      parameters:
        - $ref: '#/components/parameters/SiteHeader'
      responses:
        '200': { description: Dashboard payload }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/pages:
    get:
      tags: [Pages]
      summary: List pages
      parameters:
        - $ref: '#/components/parameters/SiteHeader'
        - name: status
          in: query
          schema: { type: string, enum: [draft, in_review, changes_requested, approved, scheduled, published, archived] }
        - name: q
          in: query
          schema: { type: string }
        - name: locale
          in: query
          schema: { type: string, enum: [th, en, zh-CN] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 5, maximum: 100, default: 20 }
      responses:
        '200':
          description: Paginated pages
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PageSummary' }
                  meta: { $ref: '#/components/schemas/Pagination' }
                  counts: { type: object, additionalProperties: { type: integer } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Pages]
      summary: Create a page
      parameters:
        - $ref: '#/components/parameters/SiteHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, locale]
              properties:
                title: { type: string, maxLength: 255 }
                slug: { type: string, maxLength: 255 }
                locale: { type: string, enum: [th, en, zh-CN] }
                excerpt: { type: string, maxLength: 2000 }
                template: { type: string, default: default }
                parent_id: { type: integer, nullable: true }
                is_home: { type: boolean }
                featured_media_id: { type: integer, nullable: true }
                blocks:
                  type: array
                  maxItems: 40
                  items: { $ref: '#/components/schemas/BlockInput' }
                seo: { $ref: '#/components/schemas/SeoInput' }
      responses:
        '201':
          description: Page created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PageDetail' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/pages/{page}:
    parameters:
      - $ref: '#/components/parameters/PageId'
    get:
      tags: [Pages]
      summary: Page detail with blocks, SEO, revisions, and capabilities
      responses:
        '200':
          description: Page detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PageDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Pages]
      summary: Update a page translation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                slug: { type: string }
                locale: { type: string, enum: [th, en, zh-CN] }
                excerpt: { type: string, nullable: true }
                template: { type: string }
                lock_version: { type: integer }
                revision_message: { type: string }
      responses:
        '200': { description: Updated page }
        '409': { description: Lock version conflict }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Pages]
      summary: Delete a page
      responses:
        '200': { description: Page deleted }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/pages/{page}/blocks:
    put:
      tags: [Pages]
      summary: Replace all blocks for one locale
      parameters:
        - $ref: '#/components/parameters/PageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locale, blocks]
              properties:
                locale: { type: string, enum: [th, en, zh-CN] }
                blocks:
                  type: array
                  maxItems: 40
                  items: { $ref: '#/components/schemas/BlockInput' }
      responses:
        '200': { description: Blocks replaced }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/pages/{page}/seo:
    put:
      tags: [SEO]
      summary: Save localized SEO metadata
      parameters:
        - $ref: '#/components/parameters/PageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/SeoInput'
                - type: object
                  properties:
                    locale: { type: string, enum: [th, en, zh-CN] }
      responses:
        '200': { description: SEO metadata saved }

  /admin/pages/{page}/submit:
    post:
      tags: [Workflow]
      summary: Submit a draft for review
      parameters:
        - $ref: '#/components/parameters/PageId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
      responses:
        '200': { description: Page moved to in_review }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/pages/{page}/approve:
    post:
      tags: [Workflow]
      summary: Approve the current review step
      parameters:
        - $ref: '#/components/parameters/PageId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
      responses:
        '200': { description: Approval recorded }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/pages/{page}/request-changes:
    post:
      tags: [Workflow]
      summary: Return a page to the author with a note
      parameters:
        - $ref: '#/components/parameters/PageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string }
      responses:
        '200': { description: Changes requested }

  /admin/pages/{page}/publish:
    post:
      tags: [Workflow]
      summary: Publish immediately
      parameters:
        - $ref: '#/components/parameters/PageId'
      responses:
        '200': { description: Page published }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: Review must complete first }

  /admin/pages/{page}/schedule:
    post:
      tags: [Workflow]
      summary: Schedule publication
      parameters:
        - $ref: '#/components/parameters/PageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [publish_at]
              properties:
                publish_at: { type: string, format: date-time }
      responses:
        '200': { description: Publication scheduled }
        '422': { description: Time must be in the future }

  /admin/pages/{page}/unpublish:
    post:
      tags: [Workflow]
      summary: Return a published page to draft
      parameters:
        - $ref: '#/components/parameters/PageId'
      responses:
        '200': { description: Page unpublished }

  /admin/pages/{page}/revisions:
    get:
      tags: [Workflow]
      summary: Revision history
      parameters:
        - $ref: '#/components/parameters/PageId'
      responses:
        '200': { description: Revision list }

  /admin/pages/{page}/revisions/{revision}/restore:
    post:
      tags: [Workflow]
      summary: Restore a snapshot
      parameters:
        - $ref: '#/components/parameters/PageId'
        - name: revision
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Revision restored }

  /admin/media:
    get:
      tags: [Media]
      summary: List media assets
      parameters:
        - $ref: '#/components/parameters/SiteHeader'
        - name: q
          in: query
          schema: { type: string }
        - name: type
          in: query
          schema: { type: string, enum: [image, document] }
      responses:
        '200': { description: Media collection }
    post:
      tags: [Media]
      summary: Upload one or more files
      parameters:
        - $ref: '#/components/parameters/SiteHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items: { type: string, format: binary }
                folder_id: { type: integer }
                alt: { type: object, additionalProperties: { type: string } }
                caption: { type: object, additionalProperties: { type: string } }
                credit: { type: string }
                license: { type: string }
                source_url: { type: string, format: uri }
      responses:
        '201':
          description: Uploaded assets (variants generated for images)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/MediaAsset' }
        '422': { description: Unsupported type or invalid file }

  /admin/media/{asset}:
    parameters:
      - name: asset
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Media]
      summary: Media asset detail
      responses:
        '200': { description: Media asset }
    patch:
      tags: [Media]
      summary: Update alt text, credit, or focal point
      responses:
        '200': { description: Updated asset }
    delete:
      tags: [Media]
      summary: Delete an unused asset
      responses:
        '200': { description: Asset deleted }
        '409':
          description: Asset is referenced by published content
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: media_in_use }

  /admin/articles:
    get:
      tags: [Content]
      summary: List articles
      parameters:
        - $ref: '#/components/parameters/SiteHeader'
      responses:
        '200': { description: Article collection }
    post:
      tags: [Content]
      summary: Create an article
      responses:
        '201': { description: Article created }

  /admin/case-studies:
    get:
      tags: [Content]
      summary: List case studies
      responses:
        '200': { description: Case study collection }
    post:
      tags: [Content]
      summary: Create a case study
      responses:
        '201': { description: Case study created }

  /admin/solutions:
    get:
      tags: [Content]
      summary: List solutions
      responses:
        '200': { description: Solution collection }

  /admin/industries:
    get:
      tags: [Content]
      summary: List industries
      responses:
        '200': { description: Industry collection }

  /admin/jobs:
    get:
      tags: [Content]
      summary: List job postings
      responses:
        '200': { description: Job collection }
    post:
      tags: [Content]
      summary: Create a job posting
      responses:
        '201': { description: Job created }

  /admin/documents:
    get:
      tags: [Content]
      summary: List investor and company documents
