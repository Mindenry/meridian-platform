        '200':
          description: Lead collection with owners
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Lead' }
                  meta: { $ref: '#/components/schemas/Pagination' }

  /admin/leads/{lead}:
    parameters:
      - name: lead
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Forms and leads]
      summary: Lead detail with activities
      responses:
        '200': { description: Lead detail }
    patch:
      tags: [Forms and leads]
      summary: Update status, owner, or follow-up
      responses:
